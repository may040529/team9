
<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Read a ToDo Item</title>
</head>
<body>
    <h1>Read a ToDo Item</h1>

    <!-- TODOをIDで検索 -->
    <form method="POST" action="/read">
        <label for="id">ID:</label>
        <input type="number" id="id" name="id" required>
        <button type="submit" name="action" value="read">Read</button>
    </form>

    <p>{{ message }}</p>

    {% if task %}
        <h2>ToDo Details</h2>
        <p>ID: {{ task[0] }}</p>
        <p>Title: {{ task[1] }}</p>
        <p>Done: {{ task[2] }}</p>

        <!-- 完了状態を変更 -->
        <h3>Update</h3>
        <form method="POST" action="/read">
            <input type="hidden" name="id" value="{{ task[0] }}">

            <select name="done">
                <option value="0" {% if not task[2] %}selected{% endif %}>Not Done</option>
                <option value="1" {% if task[2] %}selected{% endif %}>Done</option>
            </select>

            <button type="submit" name="action" value="update">Update</button>
        </form>

        <!-- TODOを削除 -->
        <h3>Delete</h3>
        <form method="POST" action="/read"
              onsubmit="return confirm('Delete this ToDo?');">
            <input type="hidden" name="id" value="{{ task[0] }}">

            <button type="submit" name="action" value="delete">Delete</button>
        </form>
    {% endif %}

    <p>Go back to <a href="/">Index</a></p>
</body>
</html>
