<!doctype html>
<html lang="ja">
    <head>  
        <meta charset="UTF-8"/>
        <title>Update a ToDo Item</title>
    </head>
    <body>
        <h1>Update a ToDo Item</h1>

        {{result}}

        <form method="POST" target="/update">
            <label for="id">Search ID:</label>
            <input type="text" id="id" name="id" required>
            <label for="done">Update Done:</label>
            <input type="text" id="done" name="done" required>
            <input type="submit" value="Update">            
        </form>
    
    <p>Go back to <a href="/">Index</a></p>
    </body>
</html>
