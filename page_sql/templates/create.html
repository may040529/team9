
<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Create a ToDo Item</title>
</head>
<body>
    <h1>Create a ToDo Item</h1>

    <p>{{ message }}</p>

    <form method="POST" action="/create">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
        <label for="due_date">締切日:</label>
        <input type="date" id="due_date" name="due_date">
        <input type="submit" value="Create">
    </form>

    <h2>Existing ToDo Items</h2>

    {% if tasks %}
        <table border="1">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Done</th>
                <th>締切日</th>
            </tr>
            {% for task in tasks %}
            <tr>
                <td>{{ task[0] }}</td>
                <td>{{ task[1] }}</td>
                <td>{{ task[2] }}</td>
                <td>{{ task[3] if task[3] else "未設定" }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No ToDo items found.</p>
    {% endif %}

    <p>Go back to <a href="/">Index</a></p>
</body>
</html>
